<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="about1.html">About Bekzhan</a>
    <a href="about2.html">About Didar</a>
    <a href="contacts.html">Contact</a>
  </nav>

  <header id="main-header" class="container">
    <h1>Contact Us</h1>
  </header>

  <div class="container">

    <div class="card">
      <img class="profile-img" src="assets/contactus.png" alt="Contact us icon" style="width:100px; height:100px;">

      <h3>Here Are Our Contacts</h3>
      <ul>
        <li>Discord: kyrusoo, tashlyg</li>
        <li>Telegram: kyrusoo, tashlyg1</li>
      </ul>
    </div>

    <div class="card">
      <form id="contact-form">
        <div>
          <label for="name">Name:</label><br>
          <input type="text" id="name" name="name" placeholder="Name">
        </div>

        <div>
          <label for="email">Email:</label><br>
          <input type="email" id="email" name="email" placeholder="example@mail.com">
        </div>

        <div>
          <label for="favcolor">Pick a favorite color:</label><br>
          <input type="color" id="favcolor" name="favcolor" value="#ff6b35">
        </div>

        <div>
          <label for="message">Message:</label><br>
          <textarea id="message" name="message" rows="4" placeholder="Write about yourself"></textarea>
        </div>

        <button type="submit" class="btn">Send</button>
      </form>
    </div>

    <a href="index.html">&larr; Back to main page</a>
  </div>

  <footer>
    <p>Bekzhan Duzeldikov &amp; Didar Marat</p>
  </footer>

</body>
</html>
